name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Content and engine checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate.js
      - run: node tools/regress.js

  browser:
    name: Browser suite
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install
      - run: npx playwright-core install --with-deps chromium
      - run: bash tests/browser/run.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-logs
          path: tests/out/*.log

  android:
    # The Android SDK is not reachable from every environment this project is
    # developed in (see android/PLAY_STORE.md), so this is the one place the
    # app is actually put through Gradle: a runner with the SDK preinstalled.
    # A green run here is the real check that the WebView shell still builds;
    # a debug build needs no signing key, unlike the release bundle Play takes.
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'
      # ubuntu-latest ships an SDK already, under $ANDROID_HOME; a setup
      # action is not needed and android-actions/setup-android@v3 fails
      # outright trying to install the "tools" package, which no longer
      # exists in Google's repository at this compileSdk. Use the
      # preinstalled sdkmanager directly instead.
      - name: Accept licenses and install the SDK platform and build-tools this project targets
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | sort -V | tail -1)"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      # Both apps: the sideload shell (app/) and the Play edition (play/),
      # as debug APKs and as the release bundles Play takes.
      - name: Build the debug APKs and the release bundles
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      # A build that compiles can still die at launch: Play once pulled a
      # build of this package whose manifest named a class the dex did not
      # hold. This checks each APK the way the phone will (tools/check-apk.js).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the APKs would load
        run: |
          node tools/check-apk.js android/app/build/outputs/apk/debug/app-debug.apk --package com.elderon.tactics
          node tools/check-apk.js android/play/build/outputs/apk/debug/play-debug.apk --package com.taugustincst.elderon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/play/build/outputs/apk/debug/play-debug.apk
          if-no-files-found: ignore

  launch:
    # The static check above proves every class the manifest names is in the
    # dex. This opens the Play edition on an emulator and fails if it crashes,
    # which catches what a static check cannot (a component the library
    # touches at launch but the manifest never declares).
    name: Play edition launch test
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/launch-test.sh "$(find apks -name play-debug.apk | head -1)" com.taugustincst.elderon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: launch-test/
          if-no-files-found: ignore
