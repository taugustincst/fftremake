name: Release (Play bundle)

# Builds the Google Play bundle of Chronicles of Elderon, the paid edition
# with the whole game inside it, and keeps it as this run's artifact for
# uploading in the Play Console. Run it from the Actions tab with a version
# number.
#
# Nothing is published anywhere. Elderon is sold only on Google Play, so this
# no longer attaches a sideload APK, a single-file web build, desktop
# packages or an itch.io zip to a public GitHub Release, and no longer pushes
# to itch.io: each of those was the whole game, free.
#
# The bundle is signed with the upload key from the repository's secrets
# (ANDROID_UPLOAD_KEYSTORE, base64 of the .jks, with
# ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and
# ANDROID_UPLOAD_KEY_PASSWORD). Without them the run fails, since a
# debug-signed bundle is nothing Play would take (see android/PLAY_STORE.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 3.0.0'
        required: true
        type: string
      version_code:
        description: 'Android versionCode. Default: from the version, 3.0.0 -> 30000. Pass a higher one if the Play Console shows one.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}

jobs:
  release:
    name: Build the Play bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: ver
        run: |
          V="${{ inputs.version }}"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          # Every upload to Play must carry a higher versionCode than the
          # last. It is derived from the version so it climbs with it and
          # can be read off a release: 1.14.1 is 11401. The version_code
          # input overrides it when the console already holds a higher one.
          CODE="${{ inputs.version_code }}"
          if [ -z "$CODE" ]; then
            IFS=. read -r MA MI PA <<< "$V"
            MA="${MA%%[^0-9]*}"; MI="${MI%%[^0-9]*}"; PA="${PA%%[^0-9]*}"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version $V, versionCode $CODE"

      # The Android build, on a runner that has the SDK (see ci.yml for why
      # sdkmanager is found by hand).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'
      - name: Install the SDK platform and build-tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      # The upload key, when the repository holds it: the keystore is decoded
      # next to the file build.gradle reads, and both are ignored by git.
      - name: Set up the Play upload key
        if: env.ANDROID_UPLOAD_KEYSTORE != ''
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "release builds will be signed with the upload key"
      - name: Build the Play bundle
        working-directory: android
        run: |
          if [ ! -f keystore.properties ]; then
            echo "no upload key in the secrets: Play only takes a bundle signed with it"; exit 1
          fi
          chmod +x gradlew
          ./gradlew :play:assembleRelease :play:bundleRelease --no-daemon \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }}
          cp play/build/outputs/bundle/release/play-release.aab \
             "../chronicles-of-elderon-${{ steps.ver.outputs.name }}-play.aab"
      # The build that Play pulled for not loading named a class its dex did
      # not hold. Every bundle is checked for that first, through the APK of
      # the same build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the build would load
        run: node tools/check-apk.js android/play/build/outputs/apk/release/play-release.apk --package com.taugustincst.elderon
      - name: Remove the key from the runner
        if: always()
        run: rm -f android/upload.jks android/keystore.properties
      # Kept with the run, not on a public release: download it from the
      # run's page and upload it in the Play Console.
      - uses: actions/upload-artifact@v4
        with:
          name: chronicles-of-elderon-${{ steps.ver.outputs.name }}-play
          path: chronicles-of-elderon-${{ steps.ver.outputs.name }}-play.aab
          retention-days: 14
